# Fox-style multi-factor agent, BTC perpetual.
#
# The defaults here are deliberately conservative and match the safest
# settings the 22-agent experiment could support: few signals, long cooldown,
# low leverage, protective exits enabled.

name: fox_btc
symbol: BTC

# Start with a preset, then override individual values below.
# conservative | balanced | aggressive
#
# The six preset fields are restated explicitly in this file so the effective
# configuration can be read without opening the code. That makes them the
# authority: the loader merges presets with `setdefault`, so a value written
# here wins over the preset. A test asserts they equal the named preset's
# values, which turns a stale preset into a failure rather than a config that
# quietly runs something other than what it says.
risk_preset: balanced

# ---------------------------------------------------------------------------
# Factor weights. Must be positive; they are normalised to sum to 1.0.
# The 40/35/25 split mirrors the reference implementation.
# ---------------------------------------------------------------------------
weights:
  smart_money: 0.40
  technical: 0.35
  market: 0.25

# ---------------------------------------------------------------------------
# Technical indicator settings.
# ---------------------------------------------------------------------------
indicators:
  entry_timeframe: 1h
  trend_timeframe: 4h
  supertrend_period: 10
  supertrend_multiplier: 3.0
  rsi_period: 14
  adx_period: 14
  ema_fast: 20
  ema_slow: 50
  atr_period: 14
  lookback_candles: 300

# ---------------------------------------------------------------------------
# Discipline. This is the Fox layer: the guardrails that matter more than the
# signal. Every field here is a hard limit, not a preference.
#
# Evidence from the 22-agent experiment:
#   * >400 trades -> every agent lost. <120 trades -> every agent won.
#   * Same scanner, more signals taken -> 56 points of ROI given up.
#   * Pure TA -18%, mean reversion -33% / -22%.
# ---------------------------------------------------------------------------
discipline:
  long_threshold: 55.0        # balanced preset: 60/40 -> 55/45
  short_threshold: 45.0
  # Both are wall-clock limits, not bar counts: 120 minutes is 2 bars on 1h and
  # 8 on 15m, so the cooldown binds less on a finer timeframe. Measured at the
  # conservative 3 / 240, neither was tight - the engine's rejection counters
  # never recorded a `daily cap` event, and entries ran at ~0.19 per symbol per
  # day against a cap of 3. Loosening both moved the count by 2 (130 -> 132),
  # so the difference from conservative is mostly the thresholds, not these.
  max_signals_per_day: 5      # cap on new entries per symbol per day
  cooldown_minutes: 120       # minimum gap between entries
  require_smart_money_alignment: true   # Bison's rule: disagree means no trade
  btc_trend_filter: true                # no dip-buying while BTC 4h is down
  btc_trend_timeframe: 4h
  min_score_gap: 3.0          # ignore signals that barely cross a threshold
  # Trend-strength floor. ADX carries no direction, so this is a regime gate:
  # it stands aside when the market is chopping, which is where an EMA/RSI read
  # is least meaningful. 0 disables.
  min_adx: 20.0
  # Volume confirmation: the entry bar's volume must exceed its own 20-bar
  # average. Volume is the only input in this strategy not derived from price,
  # so it is the only one that can corroborate a move rather than restate it.
  volume_confirm: true
  volume_ma_period: 20
  volume_multiplier: 1.0

# Overall confidence floor. Below this, too many inputs are missing.
min_confidence: 0.35

# ---------------------------------------------------------------------------
# Risk. Protective exits are ENABLED here, unlike the upstream template which
# ships them off. A disabled stop-loss relies on self-discipline at exactly the
# moment it is least available.
# ---------------------------------------------------------------------------
risk:
  account_allocation_pct: 10.0   # max share of equity as notional
  # balanced preset. These two are the fields where the preset changes the risk
  # of the run rather than its signal rate: doubling the per-trade risk budget
  # and raising leverage from 2x to 3x. The measured edge did not improve to
  # pay for it - the random-direction baseline beat the strategy in 20 runs out
  # of 20. See the entry-signal section of the README.
  leverage: 3
  risk_per_trade_pct: 2.0        # risk budget per trade
  max_position_usd: 0            # 0 = derive from equity
  stop_loss_enabled: true
  stop_loss_pct: 3.0             # ignored while stop_loss_atr_multiple > 0
  # Volatility-scaled stop: 2 ATR(14) from entry. A fixed 3% is wide on a quiet
  # day and inside the noise on a violent one, and BTC is both within a month.
  stop_loss_atr_multiple: 2.0
  # Trailing stop. DISABLED, because it was measured and it loses.
  #
  # The request was a 1.5 ATR trail behind the best price. Implemented and
  # measured over 170 days x 3 markets, every variant was worse than no trail:
  #
  #   no trail              130 trades   PF 1.32   +5.30%   stop:95  take:23
  #   trail 1.5, active now 328 trades   PF 0.86   -2.81%   stop:326 take:1
  #   trail 1.5, act 0.5A   315 trades   PF 0.92   -1.59%   stop:313 take:1
  #   trail 1.5, act 1.5A   288 trades   PF 0.80   -4.86%   stop:286 take:1
  #   trail 3.0 (wider)     199 trades   PF 1.02   +0.48%   stop:187 take:11
  #
  # The mechanism is in the `take` column: the trail exits at ~1.5 ATR, so the
  # 9% target is essentially never reached (23 take-profits collapse to 1). And
  # because only one position may be open at a time, every trail exit frees the
  # slot for a new entry - the trade count more than doubles, which is the one
  # variable this project's own evidence says dominates outcomes.
  #
  # The interaction that makes it worse than it looks: a 1.5 ATR trail is
  # TIGHTER than the 2 ATR stop, so it supersedes the stop on the first bar and
  # the 2 ATR stop never binds at all. Set `trailing_activation_atr_multiple` to
  # defer it if the trail is ever re-enabled.
  #
  # Set this above 0 to turn it back on; the sweep above is the reason not to.
  trailing_stop_atr_multiple: 0.0
  trailing_activation_atr_multiple: 1.5
  take_profit_enabled: true
  take_profit_pct: 9.0           # 3:1 reward:risk, matching Fox's asymmetry
  # Peak-to-trough equity drawdown that HALTS new entries. The halt is
  # persisted, so restarting the process does not bypass it.
  max_drawdown_pct: 15.0
  max_open_positions: 1

# Hard backstop that applies even if stop_loss_enabled is turned off.
safety:
  hard_stop_pct: 5.0

# ---------------------------------------------------------------------------
# Execution.
# ---------------------------------------------------------------------------
execution:
  order_type: limit            # limit captures maker fees (0.01% vs 0.035% taker)
  limit_offset_bps: 5.0
  slippage_bps: 20.0
  max_spread_bps: 25.0
  poll_interval_seconds: 300   # 5 minutes; this is not a scalping bot
  dry_run: true                # overridden to false only via --live flags
  testnet: true                # mainnet requires an explicit change

# ---------------------------------------------------------------------------
# Smart money source: which whale wallets count as "smart".
#
# Ranking accounts by ONE window is a luck-contaminated proxy. Measured on live
# data, the top-25 by "week" and by "month" shared only 11% of their members,
# and the "day" set collapsed to 2 BTC holders with one wallet at 79.9% of
# gross notional.
#
# So we sample several windows and UNION them. Measured on BTC:
#
#   single window, top 25      10 holders   largest position 43.6% of gross
#   union, hard-filtered >=2    3 holders   45.6%    <- worse
#   union, unfiltered          18 holders   27.8%    <- what we use
#
# Hard-filtering by persistence actually HURTS: the wallets that rank across
# windows are large diversified accounts that often hold nothing in a given
# symbol, while the directional traders who do hold it appear in one window
# only. So persistence is applied as a WEIGHT on each wallet's notional
# (a 3-window wallet counts 3x), not as a filter.
# ---------------------------------------------------------------------------
smart_money:
  windows: [day, week, month]  # leaderboard windows to rank by
  top_per_window: 60           # accounts taken from each window (unioned)
  min_persistence: 1           # 1 = no hard filter; persistence only weights.
                               # Raise to 2+ for a stricter but smaller set.
  max_wallets: 150             # cap on candidates (bounds HTTP reads)
  min_account_value: 10000     # ignore dust accounts; their positions are noise
  # Exclude wallets trading faster than this many fills per day. Ranking by raw
  # PnL otherwise selects market makers: of the wallets entering the 30-day
  # top 60 over 417 archived days, 53% trade >1000 times a day and 86% >200,
  # while 0.4% trade <10. Their positions are inventory, not a directional
  # view.
  #
  # The wallet-composition measurement above is solid (417 days, every fill).
  # What follows from it is NOT. An earlier version of this comment cited a
  # single window where profit factor went 1.03 -> 1.52; that window turned out
  # to be where the value was chosen, and a walk-forward split (tune on the
  # first 104 days, evaluate once on the next 104) does not reproduce it:
  #
  #              no filter   ceiling=10   no whale data at all
  #   in-sample      1.30        1.32            -
  #   out-of-sample  0.43        0.79           1.02
  #
  # Two things follow. The ceiling does point the right way - it improves the
  # factor in both halves - but on the evaluation half even the filtered factor
  # (0.79) is worse than not using it (1.02). So the 40% weight itself is the
  # open question, not the ceiling. Left enabled because it is the better of
  # the two factor configurations, not because it is proven.
  max_fills_per_day: 50
  # Floor on the account value the VENUE reports, not the leaderboard's own
  # number. Measured on the live union of all three windows: 77 wallets pass
  # min_account_value, and 59 of them (77%) have a main-dex value of exactly
  # zero while advertising hundreds of millions on the leaderboard - that
  # figure spans every venue the account touches.
  # Effect measured, not assumed: the same positions, read from 18 wallets per
  # snapshot instead of 77. It does not add positions, because the union sits
  # well under max_wallets, so the cap is not cutting anything today.
  # Set to null to disable.
  min_live_account_value: 10000
  # Manual overrides. Whitelisted wallets are always included and counted as
  # fully persistent, so a hand-verified track record is never screened out.
  # They also bypass the activity ceiling above, which is a screen for market
  # makers rather than a judgement on a hand-picked wallet.
  # whitelist: ["0x..."]
  # blacklist: ["0x..."]

# Set to true to use the curated Hyperfeed instead of the leaderboard.
# Requires SENPI_API_KEY to be exported; falls back to the leaderboard if absent.
use_hyperfeed: false
